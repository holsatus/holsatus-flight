[package]
name = "stm32-support"
version = "0.1.0"
edition = "2024"

[features]

# Internal: selected by chip features for MCUs that have a non-cached DMA SRAM
# region (H7 `RAM_D3`/SRAM4). Enabling it makes `dma_buffer!` emit `.ram_d3`,
# which requires the device's `memory.x` to map that section into the region.
# Do not enable this directly; enable the chip feature instead.
__use_ram_d3 = []

stm32f405rg = [
    "embassy-stm32/stm32f405rg",
    "embassy-stm32/time-driver-tim2",
]

stm32h743vi = [
    "embassy-stm32/stm32h743vi",
    "embassy-stm32/time-driver-tim2",
    "__use_ram_d3",
]

[dependencies]

defmt = "1.0.1"
static_cell = "2"
aligned = "0.4.2"

[dependencies.common]
path = "../../common"
default-features = false

[dependencies.embassy-futures]
git = "https://github.com/embassy-rs/embassy"
rev = "5bc8260"

[dependencies.embassy-executor]
git = "https://github.com/embassy-rs/embassy"
rev = "5bc8260"
features = [
    "platform-cortex-m",
    "executor-interrupt",
    "executor-thread",
]

[dependencies.embassy-stm32]
git = "https://github.com/embassy-rs/embassy"
rev = "5bc8260"
features = [
    "defmt",
    "exti",
]
