[package]
name = "micoair-h743-v2"
version = "0.1.0"
edition = "2021"

[features]
default = ["sdmmc", "gnss", "mavlink"]

mpc = ["common/mpc"]
sdmmc = []
gnss = ["common/gnss"]
usb = ["common/usb"]

mavlink = ["common/mavlink"]

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"

defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0" }

dshot-encoder = { git = "https://github.com/peterkrull/dshot-encoder" }

assign-resources = "0.5.0"
static_cell = "2"   # Used to allocate buffers and interrupt executors
aligned = "0.4.2"   # Used to implement BlockDevice on wrapper type

[dependencies.common]
path = "../../common"
default-features = false
features = [
    "imu_count_2",
    "defmt",
]

[dependencies.embassy-embedded-hal]
git = "https://github.com/embassy-rs/embassy"
rev = "5bc8260"
features = []

[dependencies.embassy-executor]
git = "https://github.com/embassy-rs/embassy"
rev = "5bc8260"
features = [
    "executor-interrupt",
    "executor-thread",
    "platform-cortex-m",
]

[dependencies.embassy-stm32]
git = "https://github.com/embassy-rs/embassy"
rev = "5bc8260"
features = [
    "defmt",
    "exti",
]

[dependencies.stm32-support]
path = "../../platform/stm32-support"
features = ["stm32h743vi"]

# cargo build/run --release
[profile.release]
panic = "abort"
codegen-units = 1
debug = true
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3 # Extremely agressive optimizations
overflow-checks = false

# cargo build/run (debug)
[profile.dev]
codegen-units = 1
debug = true
debug-assertions = true
incremental = false
lto = 'fat'
opt-level = 'z'
overflow-checks = true

# This is done to avoid tests etc from
# being built for the no_std binary
[[bin]]
name = "micoair-h743-v2"
path = "src/main.rs"
test = false
doctest = false
bench = false
