[package]
name = "micoairh743v2"
version = "0.1.0"
edition = "2021"

[dependencies]

embassy-executor     = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-stm32        = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260", features = ["stm32h743vi", "time-driver-tim2", "exti", "defmt", "unstable-pac"] }
embassy-time         = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync         = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260", features = ["defmt"] }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260", features = ["defmt"] }
embassy-futures      = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }

cortex-m           = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt        = "0.7"
defmt              = "1.0.1"
defmt-rtt          = "1.0.0"
embedded-hal       = "1.0"
embedded-hal-async = "1.0"
heapless           = { version = "0.9.2", default-features = false }
libm               = "0.2"
panic-probe        = { version = "1.0.0", features = ["print-defmt"] }
static_cell        = "2"

dshot-encoder    = { git = "https://github.com/peterkrull/dshot-encoder" }
assign-resources = "0.5.0"

mavio = { git = "https://gitlab.com/peterkrull/mavio/", rev = "6844d3ec45b82686a44ac37b4e7df56d2673fef9", default-features = false, features = ["dlct-common", "embedded-io-async"] }

# 64-bit atomics for `phoenix_telem` (Cortex-M has no native AtomicU64/I64).
# Falls back to a critical-section impl on this target.
portable-atomic     = "1.9"

aligned             = "0.4.2"
serde               = { version = "1.0", default-features = false, features = ["derive"] }
postcard            = { version = "1.0.10", default-features = false }
embedded-fatfs      = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "428ad03", default-features = false, features = ["defmt"] }
block-device-adapters = { version = "0.2.0", features = ["defmt"] }
# embedded-fatfs uses embedded-io-async 0.6.1; alias matches common's convention
embedded-io-async-061 = { package = "embedded-io-async", version = "0.6.1" }

[dependencies.common]
path = "../../common"
default-features = false
features = ["defmt"]

# cargo build/run --release
[profile.release]
panic = "abort"
codegen-units = 1
debug = true
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# cargo build/run (debug)
[profile.dev]
codegen-units = 1
debug = true
debug-assertions = true
incremental = false
lto = 'fat'
opt-level = 'z'
overflow-checks = true

